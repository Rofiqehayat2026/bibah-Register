<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ড্যাশবোর্ডে নেওয়া হচ্ছে</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body style="font-family:sans-serif;padding:24px">ড্যাশবোর্ডে নেওয়া হচ্ছে...<script>(async()=>{try{const s=await RH.getSession();if(!s){location.replace('login.html');return;}const {data,error}=await sb.from('admin_users').select('role,is_active').eq('user_id',s.user.id).maybeSingle();if(error)throw error;if(data&&data.is_active)location.replace('admin-panel.html');else location.replace('member.html');}catch(e){document.body.textContent='ড্যাশবোর্ড খোলা যায়নি: '+(e.message||e);}})();</script></body></html>
