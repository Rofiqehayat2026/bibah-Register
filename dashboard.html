<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ড্যাশবোর্ড | রফিকে হায়াত</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
/* ============ বেস ============ */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans Bengali','Segoe UI',Tahoma,sans-serif}
body{background:#f2f5f9;color:#1e2b3a;line-height:1.6;padding:1rem}
.container{max-width:1100px;margin:0 auto;background:#fff;border-radius:20px;box-shadow:0 12px 32px rgba(0,20,30,.08);padding:1.8rem}
.card{background:#f9fcff;border-radius:16px;padding:1.4rem;margin-bottom:1.4rem;border:1px solid #d9e6f2}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.4rem}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.form-group{margin-bottom:.9rem}
.form-group label{display:block;font-weight:600;margin-bottom:.35rem;font-size:.93rem;color:#0b3b4a}
input,select,textarea{width:100%;padding:.65rem .95rem;border:1.5px solid #cbdae5;border-radius:12px;font-size:.97rem;background:#fff;outline:none;font-family:inherit;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:#1e7e5e;box-shadow:0 0 0 3px rgba(30,126,94,.15)}
textarea{min-height:80px;resize:vertical}
.btn{background:linear-gradient(145deg,#1e7e5e,#146b4e);color:#fff;border:none;padding:.85rem 1.8rem;font-size:1rem;font-weight:700;border-radius:40px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
.btn:hover{background:linear-gradient(145deg,#146b4e,#0e523b);transform:translateY(-1px);box-shadow:0 6px 16px rgba(30,126,94,.25)}
.btn:disabled{opacity:.6;cursor:wait;transform:none;box-shadow:none}
.btn-secondary{background:#e2f0f5;color:#0e4d64;border:1.5px solid #b7d4de}
.btn-secondary:hover{background:#cfe5ee;color:#0e4d64;box-shadow:none}
.btn-block{width:100%}
.section-title{font-size:1.35rem;font-weight:600;color:#0b3b4a;margin:1.6rem 0 .9rem;padding:.55rem .9rem;border-left:5px solid #1e7e5e;background:linear-gradient(to right,#e9f3f0,transparent);border-radius:0 10px 10px 0;display:flex;align-items:center;gap:8px}
.section-title i{color:#1e7e5e}
.badge{padding:.2rem .65rem;border-radius:20px;font-size:.78rem;font-weight:600;display:inline-block}
.badge-pending{background:#fff3cd;color:#856404}
.badge-verified{background:#d1e7dd;color:#0f5132}
.badge-rejected{background:#f8d7da;color:#842029}
.badge-matched{background:#cfe2ff;color:#084298}
.header-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-bottom:1.4rem;padding-bottom:1rem;border-bottom:2px dashed #cbd9e6}
.header-bar h1{font-size:1.6rem;color:#0e4d64;display:flex;align-items:center;gap:10px}
.header-bar h1 i{color:#1e7e5e}
.alert{padding:.8rem 1.1rem;border-radius:12px;margin:.8rem 0;font-size:.93rem}
.alert-info{background:#e7f1f7;color:#0e4d64}
.alert-error{background:#fce4e4;color:#b42318}
.alert-success{background:#d9f1e8;color:#0f5132}
.alert-warning{background:#fff3cd;color:#856404}
.hidden{display:none!important}
.text-center{text-align:center}
.mt-1{margin-top:.5rem}.mt-2{margin-top:1rem}.mt-3{margin-top:1.5rem}
.mb-1{margin-bottom:.5rem}.mb-2{margin-bottom:1rem}.mb-3{margin-bottom:1.5rem}
.preview-row{display:flex;border-bottom:1px dashed #d0e0ea;padding:.5rem 0;font-size:.93rem}
.preview-row .lbl{flex:1;font-weight:600;color:#0b3b4a}
.preview-row .val{flex:2;color:#1e2b3a}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;overflow-y:auto;padding:1rem}
.modal.show{display:block}
.modal-box{max-width:760px;margin:2rem auto;background:#fff;padding:1.8rem;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}

/* ============ ট্যাব ============ */
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.2rem;border-bottom:2px solid #d0e0ea;padding-bottom:.3rem}
.tab-btn{background:none;border:none;padding:.65rem 1.1rem;border-radius:10px 10px 0 0;cursor:pointer;font-weight:600;color:#45748a;font-family:inherit;font-size:.95rem;transition:.15s}
.tab-btn:hover{background:#e8f3f0;color:#0e4d64}
.tab-btn.active{background:#1e7e5e;color:#fff}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ============ নোটিফিকেশন ============ */
.notif-item{background:#fff8e5;border-left:4px solid #f0a500;padding:.8rem 1rem;border-radius:8px;margin-bottom:.6rem;font-size:.92rem}
.notif-item.unread{background:#fff3cd;font-weight:500}

/* ============ প্রার্থী কার্ড ============ */
.candidate-card{background:#fff;border:1px solid #d9e6f2;border-radius:14px;padding:1rem;margin-bottom:1rem;transition:.15s}
.candidate-card:hover{box-shadow:0 6px 18px rgba(30,126,94,.1);border-color:#1e7e5e}
.candidate-card .code-badge{background:#e2f0f5;color:#0e4d64;padding:.15rem .6rem;border-radius:20px;font-size:.82rem;font-weight:600;font-family:monospace}
.candidate-card .info-row{font-size:.9rem;color:#45748a;margin-top:.25rem}
.candidate-card .info-row strong{color:#0b3b4a}
.access-card{background:#f0f9f6;border:1px solid #b7d9d0;border-radius:14px;padding:1.1rem;margin-bottom:1rem}

/* ============ কাউন্টডাউন ============ */
.countdown{display:inline-flex;align-items:center;gap:6px;padding:.3rem .8rem;border-radius:20px;font-weight:600;font-size:.85rem}
.countdown-ok{background:#d1e7dd;color:#0f5132}
.countdown-warn{background:#fff3cd;color:#856404}
.countdown-danger{background:#f8d7da;color:#842118;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.countdown-timer{font-family:monospace;letter-spacing:.02em}

/* ============ রেসপন্সিভ ============ */
@media(max-width:820px){
  .grid-2,.grid-3{grid-template-columns:1fr}
  .container{padding:1.2rem}
}
</style>
</head>
<body>
<div class="container">
  <div class="header-bar">
    <h1><i class="fas fa-user-circle"></i> আমার ড্যাশবোর্ড</h1>
    <div style="display:flex;align-items:center;gap:.7rem;flex-wrap:wrap">
      <span id="userInfo" style="font-size:.9rem;color:#45748a"></span>
      <button class="btn btn-secondary" onclick="RH.logout()" style="padding:.5rem 1rem;font-size:.9rem">
        <i class="fas fa-sign-out-alt"></i> লগআউট
      </button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="home"><i class="fas fa-home"></i> হোম</button>
    <button class="tab-btn" data-tab="browse"><i class="fas fa-users"></i> প্রার্থী খুঁজুন</button>
    <button class="tab-btn" data-tab="requests"><i class="fas fa-paper-plane"></i> আমার অনুরোধ</button>
    <button class="tab-btn" data-tab="approved"><i class="fas fa-eye"></i> অনুমোদিত বায়োডাটা</button>
  </div>

  <!-- ট্যাব ১: হোম -->
  <div class="tab-panel active" id="panel-home">
    <div id="biodataStatusCard" class="card">লোড হচ্ছে...</div>
    <div class="section-title"><i class="fas fa-bell"></i> নোটিফিকেশন</div>
    <div id="notificationsList">লোড হচ্ছে...</div>
  </div>

  <!-- ট্যাব ২: প্রার্থী খুঁজুন -->
  <div class="tab-panel" id="panel-browse">
    <div class="card">
      <div class="grid-3">
        <div class="form-group">
          <label>লিঙ্গ</label>
          <select id="filterGender">
            <option value="">সবাই</option>
            <option value="male">পাত্র</option>
            <option value="female">পাত্রী</option>
            <option value="boy_khunsha">ছেলে খুনসা</option>
            <option value="girl_khunsha">মেয়ে খুনসা</option>
          </select>
        </div>
        <div class="form-group">
          <label>বিভাগ</label>
          <select id="filterDivision">
            <option value="">সব বিভাগ</option>
            <option>ঢাকা</option><option>চট্টগ্রাম</option><option>রাজশাহী</option>
            <option>খুলনা</option><option>বরিশাল</option><option>সিলেট</option>
            <option>রংপুর</option><option>ময়মনসিংহ</option>
          </select>
        </div>
        <div class="form-group" style="display:flex;align-items:flex-end">
          <button class="btn btn-block" id="searchBtn" style="width:100%">
            <i class="fas fa-search"></i> খুঁজুন
          </button>
        </div>
      </div>
    </div>
    <div class="alert alert-info">
      <i class="fas fa-shield-alt"></i> এখানে শুধু <strong>প্রাথমিক তথ্য</strong> — নাম, ছবি, যোগাযোগ লুকানো।
      বিস্তারিত দেখতে অ্যাডমিনের অনুমোদন লাগবে।
    </div>
    <div id="browseResults">লোড হচ্ছে...</div>
  </div>

  <!-- ট্যাব ৩: আমার অনুরোধ -->
  <div class="tab-panel" id="panel-requests">
    <div id="myRequestsList">লোড হচ্ছে...</div>
  </div>

  <!-- ট্যাব ৪: অনুমোদিত -->
  <div class="tab-panel" id="panel-approved">
    <div id="approvedList">লোড হচ্ছে...</div>
  </div>
</div>

<!-- বিস্তারিত মোডাল -->
<div id="detailModal" class="modal">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <h2 style="color:#0e4d64;font-size:1.3rem"><i class="fas fa-user"></i> বিস্তারিত বায়োডাটা</h2>
      <button class="btn btn-secondary" onclick="closeDetail()" style="padding:.4rem .9rem">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <div id="detailContent">লোড হচ্ছে...</div>
  </div>
</div>

<script>
let currentSession = null;
let currentProfile = null;

// ============ সেশন গার্ড ============
(async function init() {
  currentSession = await RH.getSession();
  if (!currentSession) { location.href = 'login.html'; return; }
  currentProfile = await RH.getProfile();

  document.getElementById('userInfo').innerHTML =
    `<i class="fas fa-user"></i> ${RH.esc(currentProfile?.full_name || currentSession.user.email)}`;

  // প্রতিবার লোডে মেয়াদোত্তীর্ণ গুলো expire মার্ক করি
  sb.rpc('expire_old_access_requests').catch(err => console.warn('expire:', err));

  await Promise.all([loadHome(), loadNotifications()]);
})();

// ============ ট্যাব সুইচ ============
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');

    if (btn.dataset.tab === 'browse') await loadBrowse();
    if (btn.dataset.tab === 'requests') await loadMyRequests();
    if (btn.dataset.tab === 'approved') await loadApproved();
  });
});

// ============ হোম: বায়োডাটা স্ট্যাটাস ============
async function loadHome() {
  const el = document.getElementById('biodataStatusCard');
  const { data, error } = await sb.from('biodata_records')
    .select('id, biodata_code, applicant_type, status, created_at')
    .eq('user_id', currentSession.user.id)
    .order('created_at', { ascending: false })
    .limit(1)
    .maybeSingle();

  if (error) {
    el.innerHTML = `<div class="alert alert-error">ত্রুটি: ${RH.esc(error.message)}</div>`;
    return;
  }

  if (!data) {
    el.innerHTML = `
      <div class="text-center" style="padding:1rem">
        <i class="fas fa-file-alt" style="font-size:2.5rem;color:#cbdae5;margin-bottom:.8rem"></i>
        <h3 style="color:#0e4d64">আপনার কোনো বায়োডাটা নেই</h3>
        <p style="color:#45748a;margin-top:.4rem">শুরু করতে বায়োডাটা ফরম পূরণ করুন।</p>
        <a href="index.html" class="btn mt-1" style="display:inline-flex">
          <i class="fas fa-plus"></i> বায়োডাটা তৈরি করুন
        </a>
      </div>`;
    return;
  }

  const statusBadge = {
    pending: '<span class="badge badge-pending">অ্যাডমিন যাচাইয়ের অপেক্ষায়</span>',
    verified: '<span class="badge badge-verified">✅ যাচাইকৃত</span>',
    rejected: '<span class="badge badge-rejected">❌ বাতিল</span>',
    matched: '<span class="badge badge-matched">💚 ম্যাচড</span>'
  }[data.status] || `<span class="badge">${RH.esc(data.status)}</span>`;

  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;align-items:center">
      <div>
        <div style="font-size:.85rem;color:#45748a">আপনার বায়োডাটা আইডি</div>
        <div style="font-size:1.8rem;font-weight:700;color:#1e7e5e;font-family:monospace">
          ${RH.esc(data.biodata_code)}
        </div>
        <div style="margin-top:.5rem">${statusBadge}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:.85rem;color:#45748a">জমা দেওয়ার তারিখ</div>
        <div style="font-weight:600">${RH.fmtDate(data.created_at)}</div>
        <a href="biodata-preview.html?id=${data.id}" class="btn mt-1" style="display:inline-flex;padding:.5rem 1rem;font-size:.9rem">
          <i class="fas fa-eye"></i> প্রিভিউ / প্রিন্ট
        </a>
      </div>
    </div>`;
}

// ============ নোটিফিকেশন ============
async function loadNotifications() {
  const el = document.getElementById('notificationsList');
  const { data, error } = await sb.from('notifications')
    .select('*')
    .eq('user_id', currentSession.user.id)
    .order('created_at', { ascending: false })
    .limit(20);

  if (error) {
    el.innerHTML = `<div class="alert alert-error">${RH.esc(error.message)}</div>`;
    return;
  }
  if (!data?.length) {
    el.innerHTML = `<div class="alert alert-info">কোনো নোটিফিকেশন নেই।</div>`;
    return;
  }

  el.innerHTML = data.map(n => `
    <div class="notif-item ${n.is_read ? '' : 'unread'}">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:.3rem">
        <strong>${RH.esc(n.title)}</strong>
        <span style="font-size:.8rem;color:#45748a">${RH.fmtDate(n.created_at)}</span>
      </div>
      <div style="margin-top:.3rem">${RH.esc(n.message)}</div>
    </div>`).join('');

  const unreadIds = data.filter(n => !n.is_read).map(n => n.id);
  if (unreadIds.length) {
    await sb.from('notifications').update({ is_read: true }).in('id', unreadIds);
  }
}

// ============ প্রার্থী খুঁজুন ============
async function loadBrowse() {
  const el = document.getElementById('browseResults');
  el.innerHTML = 'লোড হচ্ছে...';
  const gender = document.getElementById('filterGender').value || null;
  const division = document.getElementById('filterDivision').value || null;

  const { data, error } = await sb.rpc('list_public_biodatas', {
    p_gender: gender,
    p_division: division,
    p_limit: 50,
    p_offset: 0
  });

  if (error) {
    el.innerHTML = `<div class="alert alert-error">${RH.esc(error.message)}</div>`;
    return;
  }
  if (!data?.length) {
    el.innerHTML = `<div class="alert alert-info">কোনো প্রার্থী পাওয়া যায়নি।</div>`;
    return;
  }

  el.innerHTML = data.map(b => {
    const typeLabel = {
      male: 'পাত্র', female: 'পাত্রী',
      boy_khunsha: 'ছেলে খুনসা', girl_khunsha: 'মেয়ে খুনসা'
    }[b.applicant_type] || b.applicant_type;

    const btnHtml = b.has_requested
      ? '<span class="badge badge-pending">অনুরোধ পাঠানো হয়েছে</span>'
      : `<button class="btn" style="padding:.5rem 1rem;font-size:.88rem" onclick="requestAccess('${b.biodata_id}')">
           <i class="fas fa-paper-plane"></i> বিস্তারিত দেখতে অনুরোধ
         </button>`;

    return `
      <div class="candidate-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:.5rem">
          <div>
            <span class="code-badge">${RH.esc(b.biodata_code_masked)}</span>
            <span class="code-badge" style="background:#e8f3f0;color:#0f5132;margin-left:.3rem">${typeLabel}</span>
          </div>
          <div>${btnHtml}</div>
        </div>
        <div class="grid-2 mt-1" style="font-size:.88rem">
          <div class="info-row"><strong>বয়স:</strong> ${b.age || '—'} বছর</div>
          <div class="info-row"><strong>বিভাগ:</strong> ${RH.esc(b.current_division || '—')}</div>
          <div class="info-row"><strong>জেলা:</strong> ${RH.esc(b.current_district || '—')}</div>
          <div class="info-row"><strong>বৈবাহিক:</strong> ${RH.esc(b.marital_status || '—')}</div>
          <div class="info-row"><strong>শিক্ষা:</strong> ${RH.esc(b.education_type || '—')}</div>
          <div class="info-row"><strong>উচ্চতা:</strong> ${RH.esc(b.height || '—')}</div>
          <div class="info-row"><strong>গায়ের রং:</strong> ${RH.esc(b.complexion || '—')}</div>
        </div>
      </div>`;
  }).join('');
}
document.getElementById('searchBtn').addEventListener('click', loadBrowse);

// ============ অনুরোধ পাঠান ============
async function requestAccess(biodataId) {
  const { data: biodata, error: fetchErr } = await sb.from('biodata_records')
    .select('id, biodata_code, user_id, status')
    .eq('id', biodataId)
    .single();

  if (fetchErr || !biodata) {
    RH.toast('বায়োডাটা পাওয়া যায়নি', false);
    return;
  }
  if (biodata.user_id === currentSession.user.id) {
    RH.toast('নিজের বায়োডাটার অনুরোধ পাঠানো যায় না', false);
    return;
  }
  if (biodata.status !== 'verified') {
    RH.toast('এই বায়োডাটা এখনো যাচাই হয়নি', false);
    return;
  }

  const message = prompt('(ঐচ্ছিক) কেন আগ্রহী — সংক্ষেপে লিখুন (সর্বোচ্চ ২৫০ অক্ষর):') || null;
  if (message && message.length > 250) {
    RH.toast('বার্তা ২৫০ অক্ষরের বেশি হবে না', false);
    return;
  }

  const { error } = await sb.from('access_requests').insert({
    biodata_id: biodata.id,
    owner_user_id: biodata.user_id,
    requester_user_id: currentSession.user.id,
    message: message,
    owner_approved: true,
    admin_approved: false,
    status: 'pending'
  });

  if (error) {
    if (error.code === '23505') {
      RH.toast('আপনি ইতিমধ্যে এই বায়োডাটার অনুরোধ পাঠিয়েছেন', false);
    } else {
      RH.toast('ব্যর্থ: ' + error.message, false);
    }
    return;
  }
  RH.toast('✅ অনুরোধ পাঠানো হয়েছে। অ্যাডমিন যাচাই করে অনুমোদন দেবেন।');
  await loadBrowse();
}

// ============ আমার অনুরোধ ============
async function loadMyRequests() {
  const el = document.getElementById('myRequestsList');
  el.innerHTML = 'লোড হচ্ছে...';

  const { data, error } = await sb.from('access_requests')
    .select('id, status, message, created_at, approved_at, expires_at, admin_note, biodata_id, biodata_records(biodata_code, applicant_type, current_district)')
    .eq('requester_user_id', currentSession.user.id)
    .order('created_at', { ascending: false });

  if (error) {
    el.innerHTML = `<div class="alert alert-error">${RH.esc(error.message)}</div>`;
    return;
  }
  if (!data?.length) {
    el.innerHTML = `<div class="alert alert-info">আপনি এখনো কোনো অনুরোধ পাঠাননি।</div>`;
    return;
  }

  const statusMap = {
    pending: '<span class="badge badge-pending">অ্যাডমিন যাচাই করছেন</span>',
    approved: '<span class="badge badge-verified">✅ অনুমোদিত</span>',
    rejected: '<span class="badge badge-rejected">❌ বাতিল</span>',
    expired: '<span class="badge">⏰ মেয়াদ শেষ</span>'
  };

  el.innerHTML = data.map(r => `
    <div class="card">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
        <div>
          <strong style="color:#0e4d64;font-size:1.05rem;font-family:monospace">
            ${RH.esc(r.biodata_records?.biodata_code || '—')}
          </strong>
          <span style="color:#45748a;font-size:.88rem;margin-left:.6rem">
            ${RH.esc(r.biodata_records?.current_district || '')}
          </span>
        </div>
        <div>${statusMap[r.status] || r.status}</div>
      </div>
      ${r.message ? `<div style="margin-top:.5rem;font-size:.9rem;color:#45748a"><strong>আপনার বার্তা:</strong> ${RH.esc(r.message)}</div>` : ''}
      ${r.admin_note ? `<div style="margin-top:.5rem;font-size:.9rem;background:#e7f1f7;padding:.4rem .7rem;border-radius:6px"><strong>অ্যাডমিন নোট:</strong> ${RH.esc(r.admin_note)}</div>` : ''}
      
      ${r.status === 'approved' && r.expires_at ? `
        <div style="margin-top:.6rem" class="countdown-wrap" data-expires="${r.expires_at}">
          ${renderCountdown(r.expires_at)}
        </div>` : ''}
      
      <div style="margin-top:.5rem;font-size:.82rem;color:#7a95a5">
        <i class="fas fa-clock"></i> পাঠানো: ${RH.fmtDate(r.created_at)}
        ${r.approved_at ? ` &nbsp;|&nbsp; <i class="fas fa-check"></i> অনুমোদিত: ${RH.fmtDate(r.approved_at)}` : ''}
      </div>
      ${r.status === 'approved' ? `
        <div class="mt-1">
          <button class="btn" style="padding:.5rem 1rem;font-size:.9rem" onclick="showDetail('${r.biodata_id}')">
            <i class="fas fa-eye"></i> বিস্তারিত দেখুন
          </button>
        </div>` : ''}
      ${r.status === 'expired' ? `
        <div class="mt-1">
          <div class="alert alert-warning" style="font-size:.85rem;margin:0">
            <i class="fas fa-info-circle"></i> মেয়াদ শেষ। আগ্রহী হলে অ্যাডমিনের সাথে যোগাযোগ করুন মেয়াদ বাড়ানোর জন্য।
          </div>
        </div>` : ''}
    </div>`).join('');

  startAllCountdowns();
}

// ============ অনুমোদিত বায়োডাটা ============

      "প্রার্থী খুঁজুন" ট্যাব থেকে অনুরোধ পাঠান, অ্যাডমিন অনুমোদন দিলে এখানে দেখা যাবে।

        <div>
          <strong style="color:#0e4d64;font-size:1.1rem;font-family:monospace">${RH.esc(b.biodata_code)}</strong>
          <span style="color:#45748a;font-size:.9rem;margin-left:.7rem">

        </div>

          অনুমোদিত: ${RH.fmtDate(b.approved_at)}

// ============ কাউন্টডাউন হেল্পার ============
function renderCountdown(expiresAt) {
  const now = new Date();
  const exp = new Date(expiresAt);
  const diff = exp - now;

  if (diff <= 0) {
    return `<span class="countdown countdown-danger"><i class="fas fa-exclamation-triangle"></i> মেয়াদ শেষ</span>`;
  }

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  const secs = Math.floor((diff % (1000 * 60)) / 1000);

  let cls = 'countdown-ok';
  if (days < 1) cls = 'countdown-danger';
  else if (days < 2) cls = 'countdown-warn';

  return `<span class="countdown ${cls}">
    <i class="fas fa-hourglass-half"></i>
    <span class="countdown-timer">${days}দিন ${String(hours).padStart(2,'0')}ঘন্টা ${String(mins).padStart(2,'0')}মিনিট ${String(secs).padStart(2,'0')}সেকেন্ড</span>
  </span>`;
}

let countdownInterval = null;
function startAllCountdowns() {
  if (countdownInterval) clearInterval(countdownInterval);
  countdownInterval = setInterval(() => {
    document.querySelectorAll('.countdown-wrap').forEach(el => {
      const exp = el.dataset.expires;
      if (!exp) return;
      el.innerHTML = renderCountdown(exp);
    });
  }, 1000);
}
