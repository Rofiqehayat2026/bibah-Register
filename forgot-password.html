<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পাসওয়ার্ড সহায়তা | রফিকে হায়াত</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:#f2f5f9;color:#1e2b3a;font-family:'Noto Sans Bengali','Segoe UI',sans-serif;display:flex;justify-content:center;align-items:flex-start;padding-top:8vh}.box{width:min(100%,480px);background:#fff;border:1px solid #e3ebf1;border-radius:18px;padding:28px;box-shadow:0 14px 36px rgba(12,45,62,.09)}h1{text-align:center;color:#0e4d64;font-size:1.7rem;margin:0 0 8px}p{color:#587487;line-height:1.7}label{display:block;margin:16px 0 7px;font-weight:600;color:#244b5d}input{width:100%;min-height:46px;border:1px solid #cbd9e3;border-radius:10px;padding:10px 12px;font:inherit}button,.link{display:block;width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:#1e7e5e;color:white;font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}button:disabled{opacity:.6}.msg{display:none;padding:12px;border-radius:9px;margin-top:14px;line-height:1.6}.ok{display:block;background:#eaf7ef;color:#17603a}.err{display:block;background:#fff0ef;color:#9b241b}.back{text-align:center;margin-top:18px}.back a{color:#1e7e5e;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<h1>পাসওয়ার্ড ভুলে গেছেন?</h1>
<p>নিবন্ধিত মোবাইল নম্বর লিখে অনুরোধ পাঠান। ইমেইলে কোনো রিসেট লিংক যাবে না। সুপার অ্যাডমিন/অ্যাডমিন ড্যাশবোর্ডে অনুরোধটি দেখবেন এবং আপনার সঙ্গে যোগাযোগ করে পাসওয়ার্ড ঠিক করে দেবেন।</p>
<form id="resetRequestForm">
<label for="phone">নিবন্ধিত মোবাইল নম্বর</label>
<input id="phone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="01XXXXXXXXX">
<label for="note">অতিরিক্ত তথ্য (ঐচ্ছিক)</label>
<input id="note" type="text" maxlength="250" placeholder="আপনার নাম বা যোগাযোগের সুবিধাজনক সময়">
<button id="sendBtn" type="submit">অনুরোধ পাঠান</button>
</form>
<div id="msg" class="msg" role="status"></div>
<div class="back"><a href="login.html">লগইন পেজে ফিরে যান</a></div>
</div>
<script>
'use strict';
const form=document.getElementById('resetRequestForm');
const btn=document.getElementById('sendBtn');
const msg=document.getElementById('msg');
form.addEventListener('submit',async e=>{
 e.preventDefault();
 const phone=document.getElementById('phone').value.replace(/[\\s-]/g,'');
 const note=document.getElementById('note').value.trim();
 msg.className='msg';msg.textContent='';
 if(!/^(?:\\+?88)?01[3-9]\\d{8}$/.test(phone)){
   msg.textContent='সঠিক বাংলাদেশি মোবাইল নম্বর লিখুন।';msg.classList.add('err');return;
 }
 btn.disabled=true;btn.textContent='পাঠানো হচ্ছে...';
 try{
   const {data:{session}}=await sb.auth.getSession();
   const {error}=await sb.from('password_reset_requests').insert({
     phone, note: note || null, status:'pending',
     requester_user_id: session?.user?.id || null
   });
   if(error) throw error;
   msg.textContent='আপনার অনুরোধ অ্যাডমিন প্যানেলে পাঠানো হয়েছে। অ্যাডমিন আপনার সঙ্গে যোগাযোগ করবেন।';
   msg.classList.add('ok');form.reset();
 }catch(err){
   console.error(err);
   msg.textContent='অনুরোধ পাঠানো যায়নি। ডাটাবেজ সেটআপ/সংযোগ যাচাই করে আবার চেষ্টা করুন।';
   msg.classList.add('err');
 }finally{btn.disabled=false;btn.textContent='অনুরোধ পাঠান';}
});
</script>
</body>
</html>
