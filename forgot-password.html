<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পাসওয়ার্ড পুনরুদ্ধার | রফিকে হায়াত</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:#f2f5f9;color:#1e2b3a;font-family:'Noto Sans Bengali','Segoe UI',sans-serif;display:flex;justify-content:center;align-items:flex-start;padding-top:8vh}.box{width:min(100%,480px);background:#fff;border:1px solid #e3ebf1;border-radius:18px;padding:28px;box-shadow:0 14px 36px rgba(12,45,62,.09)}h1{text-align:center;color:#0e4d64;font-size:1.7rem;margin:0 0 8px}p{color:#587487;line-height:1.7}label{display:block;margin:16px 0 7px;font-weight:600;color:#244b5d}input{width:100%;min-height:46px;border:1px solid #cbd9e3;border-radius:10px;padding:10px 12px;font:inherit}button,.link{display:block;width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:#1e7e5e;color:white;font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}button:disabled{opacity:.6}.msg{display:none;padding:12px;border-radius:9px;margin-top:14px;line-height:1.6}.ok{display:block;background:#eaf7ef;color:#17603a}.err{display:block;background:#fff0ef;color:#9b241b}.back{text-align:center;margin-top:18px}.back a{color:#1e7e5e;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<h1>পাসওয়ার্ড পুনরুদ্ধার</h1>
<p>আপনার অ্যাকাউন্টে নিবন্ধিত ইমেইল ঠিকানা লিখুন। ওই ঠিকানায় পাসওয়ার্ড পরিবর্তনের নিরাপদ লিংক পাঠানো হবে।</p>
<form id="resetRequestForm">
<label for="email">নিবন্ধিত ইমেইল ঠিকানা</label>
<input id="email" type="email" autocomplete="email" required placeholder="আপনার ইমেইল লিখুন">
<button id="sendBtn" type="submit"><i class="fas fa-paper-plane"></i> রিসেট লিংক পাঠান</button>
</form>
<div id="msg" class="msg" role="status"></div>
<div class="back"><a href="login.html"><i class="fas fa-arrow-left"></i> লগইন পেজে ফিরে যান</a></div>
</div>
<script>
'use strict';
const form=document.getElementById('resetRequestForm');
const btn=document.getElementById('sendBtn');
const msg=document.getElementById('msg');
form.addEventListener('submit',async function(e){
 e.preventDefault();
 const email=document.getElementById('email').value.trim();
 msg.className='msg';msg.textContent='';
 if(!email){msg.textContent='ইমেইল ঠিকানা লিখুন।';msg.classList.add('err');return;}
 btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> পাঠানো হচ্ছে...';
 try{
  const redirectTo=location.origin+'/reset-password.html';
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});
  if(error) throw error;
  msg.textContent='যদি এই ইমেইল দিয়ে অ্যাকাউন্ট থাকে, তাহলে পাসওয়ার্ড পরিবর্তনের লিংক পাঠানো হয়েছে। ইনবক্স ও স্প্যাম ফোল্ডার দেখুন।';
  msg.classList.add('ok');
  form.reset();
 }catch(err){
  console.error('Password reset request error:',err);
  msg.textContent='রিসেট লিংক পাঠানো যায়নি: '+(err.message||'অনুগ্রহ করে পরে চেষ্টা করুন।');
  msg.classList.add('err');
 }finally{btn.disabled=false;btn.innerHTML='<i class="fas fa-paper-plane"></i> রিসেট লিংক পাঠান';}
});
</script>
</body>
</html>
