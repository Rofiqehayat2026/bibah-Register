<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>নতুন পাসওয়ার্ড | রফিকে হায়াত</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:20px;
  display:flex;align-items:center;justify-content:center;
  background:#f2f5f9;color:#1e2b3a;
  font-family:'Noto Sans Bengali','Segoe UI',sans-serif
}
.card{
  width:100%;max-width:460px;background:#fff;
  padding:28px;border-radius:17px;
  box-shadow:0 10px 35px rgba(0,0,0,.08)
}
h2{text-align:center;color:#0e4d64}
p{text-align:center;color:#587487}
label{display:block;margin:17px 0 6px;font-weight:600}
input{
  width:100%;padding:12px;
  border:1px solid #cbd9e3;border-radius:9px;
  font-size:16px
}
button{
  width:100%;margin-top:20px;padding:13px;
  border:0;border-radius:9px;background:#1e7e5e;
  color:white;font-size:16px;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.6;cursor:not-allowed}
#message{
  margin-top:15px;padding:12px;border-radius:8px;
  display:none;text-align:center
}
.success{background:#eaf7ef;color:#17603a}
.error{background:#fff0ef;color:#9b241b}
a{color:#1e7e5e;text-decoration:none}
</style>
</head>

<body>

<div class="card">

  <h2>
    <i class="fas fa-heart" style="color:#1e7e5e"></i>
    রফিকে হায়াত
  </h2>

  <p>আপনার অ্যাকাউন্টের নতুন পাসওয়ার্ড নির্ধারণ করুন।</p>

  <form id="resetForm">

    <label for="password">নতুন পাসওয়ার্ড</label>
    <input
      type="password"
      id="password"
      minlength="8"
      required
      autocomplete="new-password"
      placeholder="কমপক্ষে ৮ অক্ষর"
    >

    <label for="confirmPassword">পাসওয়ার্ড নিশ্চিত করুন</label>
    <input
      type="password"
      id="confirmPassword"
      minlength="8"
      required
      autocomplete="new-password"
      placeholder="আবার পাসওয়ার্ড লিখুন"
    >

    <button type="submit" id="saveBtn">
      <i class="fas fa-lock"></i> পাসওয়ার্ড পরিবর্তন করুন
    </button>

  </form>

  <div id="message"></div>

  <p style="margin-top:22px">
    <a href="login.html">
      <i class="fas fa-arrow-left"></i> লগইন পেজে ফিরে যান
    </a>
  </p>

</div>

<script>
"use strict";

const form = document.getElementById("resetForm");
const saveBtn = document.getElementById("saveBtn");
const message = document.getElementById("message");

function showMessage(text, success = false) {
  message.style.display = "block";
  message.className = success ? "success" : "error";
  message.textContent = text;
}

let recoverySessionReady = false;

// Recovery session check
async function initializeRecovery() {
  try {
    // Supabase SDK URL থেকে recovery session গ্রহণ করার সুযোগ পায়।
    const { data, error } = await sb.auth.getSession();

    if (error) throw error;

    if (!data.session) {
      showMessage(
        "রিসেট লিংকটি মেয়াদোত্তীর্ণ, ভুল অথবা ইতিমধ্যে ব্যবহার করা হয়েছে। নতুন রিসেট লিংক নিন।"
      );

      saveBtn.disabled = true;
      return;
    }

    recoverySessionReady = true;

  } catch (error) {
    console.error("Recovery session error:", error);
    showMessage("সেশন যাচাই করা যায়নি: " + error.message);
    saveBtn.disabled = true;
  }
}

// New password update
form.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (!recoverySessionReady) {
    showMessage("রিসেট লিংক যাচাই সম্পন্ন হয়নি। নতুন লিংক ব্যবহার করুন।");
    return;
  }

  const password = document.getElementById("password").value;
  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if (password.length < 8) {
    showMessage("পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে।");
    return;
  }

  if (password !== confirmPassword) {
    showMessage("দুটি পাসওয়ার্ড মিলছে না।");
    return;
  }

  saveBtn.disabled = true;
  saveBtn.textContent = "পাসওয়ার্ড পরিবর্তন হচ্ছে...";

  try {
    const { data, error } = await sb.auth.updateUser({
      password: password
    });

    if (error) throw error;

    if (!data.user) {
      throw new Error("পাসওয়ার্ড পরিবর্তন নিশ্চিত করা যায়নি।");
    }

    showMessage(
      "আপনার পাসওয়ার্ড সফলভাবে পরিবর্তন হয়েছে। এখন নতুন পাসওয়ার্ড দিয়ে লগইন করুন।",
      true
    );

    form.reset();
    recoverySessionReady = false;

    // Password update-এর পর recovery session বন্ধ করা
    await sb.auth.signOut();

    saveBtn.disabled = false;
    saveBtn.textContent = "লগইন পেজে যান";

    saveBtn.onclick = function() {
      window.location.href = "login.html";
    };

  } catch (error) {
    console.error("Password update error:", error);

    showMessage("পাসওয়ার্ড পরিবর্তন ব্যর্থ: " + error.message);

    saveBtn.disabled = false;
    saveBtn.textContent = "আবার চেষ্টা করুন";
  }
});

initializeRecovery();
</script>

</body>
</html>
