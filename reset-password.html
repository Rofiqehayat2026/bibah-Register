<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>নতুন পাসওয়ার্ড সেট করুন | রফিকে হায়াত</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:#f2f5f9;color:#1e2b3a;font-family:'Noto Sans Bengali','Segoe UI',sans-serif;display:flex;justify-content:center;align-items:flex-start;padding-top:8vh}.box{width:min(100%,480px);background:#fff;border:1px solid #e3ebf1;border-radius:18px;padding:28px;box-shadow:0 14px 36px rgba(12,45,62,.09)}h1{text-align:center;color:#0e4d64;font-size:1.7rem;margin:0 0 8px}p{color:#587487;line-height:1.7}label{display:block;margin:16px 0 7px;font-weight:600;color:#244b5d}input{width:100%;min-height:46px;border:1px solid #cbd9e3;border-radius:10px;padding:10px 12px;font:inherit}button,.link{display:block;width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:#1e7e5e;color:white;font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}button:disabled{opacity:.6}.msg{display:none;padding:12px;border-radius:9px;margin-top:14px;line-height:1.6}.ok{display:block;background:#eaf7ef;color:#17603a}.err{display:block;background:#fff0ef;color:#9b241b}.back{text-align:center;margin-top:18px}.back a{color:#1e7e5e;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<h1>নতুন পাসওয়ার্ড সেট করুন</h1>
<p>আপনার অ্যাকাউন্টের জন্য নতুন পাসওয়ার্ড লিখুন। কমপক্ষে ৮ অক্ষরের পাসওয়ার্ড ব্যবহার করুন।</p>
<form id="newPasswordForm">
<label for="password">নতুন পাসওয়ার্ড</label>
<input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="নতুন পাসওয়ার্ড">
<label for="confirmPassword">পাসওয়ার্ড নিশ্চিত করুন</label>
<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="আবার পাসওয়ার্ড লিখুন">
<button id="saveBtn" type="submit"><i class="fas fa-lock"></i> পাসওয়ার্ড পরিবর্তন করুন</button>
</form>
<div id="msg" class="msg" role="status"></div>
<div class="back"><a href="login.html">লগইন পেজে ফিরে যান</a></div>
</div>
<script>
'use strict';
const form=document.getElementById('newPasswordForm');
const btn=document.getElementById('saveBtn');
const msg=document.getElementById('msg');
let recoveryReady=false;
function showError(t){msg.textContent=t;msg.className='msg err';}
(async function checkRecoverySession(){
 try{
  const {data,error}=await sb.auth.getSession();
  if(error) throw error;
  if(data.session){recoveryReady=true;return;}
  showError('রিসেট লিংকটি সঠিক নয়, মেয়াদ শেষ হয়েছে অথবা ইতোমধ্যে ব্যবহার করা হয়েছে। নতুন রিসেট লিংক নিন।');
 }catch(e){console.error('Recovery session error:',e);showError('রিসেট সেশন যাচাই করা যায়নি। ইমেইলের লিংক থেকে আবার প্রবেশ করুন।');}
})();
form.addEventListener('submit',async function(e){
 e.preventDefault();
 const password=document.getElementById('password').value;
 const confirm=document.getElementById('confirmPassword').value;
 msg.className='msg';msg.textContent='';
 if(password.length<8){showError('পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে।');return;}
 if(password!==confirm){showError('দুটি পাসওয়ার্ড এক নয়।');return;}
 btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> সংরক্ষণ হচ্ছে...';
 try{
  const {data,error:sessionError}=await sb.auth.getSession();
  if(sessionError) throw sessionError;
  if(!recoveryReady && !data.session) throw new Error('রিসেট সেশন পাওয়া যায়নি। ইমেইলের লিংক থেকে আবার প্রবেশ করুন।');
  const {error}=await sb.auth.updateUser({password});
  if(error) throw error;
  msg.textContent='পাসওয়ার্ড সফলভাবে পরিবর্তন হয়েছে। এখন নতুন পাসওয়ার্ড দিয়ে লগইন করুন।';
  msg.className='msg ok';
  form.reset();
  await sb.auth.signOut();
  btn.style.display='none';
 }catch(err){console.error('Password update error:',err);showError(err.message||'পাসওয়ার্ড পরিবর্তন করা যায়নি।');}
 finally{btn.disabled=false;if(btn.style.display!=='none')btn.innerHTML='<i class="fas fa-lock"></i> পাসওয়ার্ড পরিবর্তন করুন';}
});
</script>
</body>
</html>
