<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>অ্যাডমিন লগইন | রফিকে হায়াত</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
:root {
  --primary: #0e4d64;
  --green: #1e7e5e;
  --ink: #1e2b3a;
  --muted: #587487;
  --line: #dce7ef;
  --soft: #f2f7fa;
  --danger: #b42318;
  --shadow: 0 14px 36px rgba(12,45,62,.09);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: clamp(20px, 7vh, 65px);
  background: #f2f5f9;
  color: var(--ink);
  font-family: 'Noto Sans Bengali', 'Segoe UI', sans-serif;
  line-height: 1.65;
}

.container {
  width: min(100%, 520px);
  margin: 0 auto;
  background: #fff;
  border: 1px solid #e3ebf1;
  border-radius: 20px;
  padding: clamp(16px, 3vw, 30px);
  box-shadow: var(--shadow);
}

.header { text-align: center; margin-bottom: 22px; }
.header h1 {
  color: var(--primary);
  font-size: clamp(1.5rem, 5vw, 2rem);
  margin: 0;
}
.header p { color: var(--muted); margin-top: 5px; }

.card {
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: clamp(18px, 4vw, 26px);
  box-shadow: 0 5px 18px rgba(15,55,75,.045);
}

.form-group { margin-bottom: 17px; }

label {
  display: block;
  font-weight: 600;
  color: #244b5d;
  margin-bottom: 7px;
}

input, select {
  display: block;
  width: 100%;
  min-height: 46px;
  border: 1px solid #cbd9e3;
  border-radius: 10px;
  padding: 10px 12px;
  background: #fff;
  color: var(--ink);
  outline: none;
  font: inherit;
  transition: .2s;
}

input:focus, select:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(30,126,94,.12);
}

.password-wrap { position: relative; }
.password-wrap input { padding-right: 48px; }

.toggle-password {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 17px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 0;
  border-radius: 10px;
  background: var(--green);
  color: #fff;
  padding: 12px 17px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: .2s;
  text-decoration: none;
}

.btn:hover {
  background: #17694e;
  transform: translateY(-1px);
  box-shadow: 0 5px 14px rgba(30,126,94,.18);
}

.btn:disabled {
  opacity: .6;
  cursor: not-allowed;
  transform: none;
}

.btn-block { width: 100%; }

.btn-secondary { background: #eaf1f5; color: var(--primary); }
.btn-secondary:hover { background: #dce9ef; }

.alert {
  padding: 12px 14px;
  border-radius: 10px;
  margin: 12px 0;
  background: #eef5f8;
  color: #244b5d;
  border: 1px solid #d5e5ec;
  font-size: .92rem;
}

.alert-success {
  background: #eaf7ef;
  border-color: #c8e8d2;
  color: #17603a;
}

.alert-error {
  background: #fff0ef;
  border-color: #f3cbc7;
  color: #9b241b;
}

.note {
  background: #f4f8fa;
  border-left: 3px solid #8bb7c8;
  padding: 10px 12px;
  border-radius: 7px;
  color: var(--muted);
  font-size: .85rem;
  margin-top: 15px;
}

.hidden { display: none !important; }

.footer {
  text-align: center;
  margin-top: 20px;
  font-size: .9rem;
  color: var(--muted);
  line-height: 2.2;
}

.footer a {
  color: var(--green);
  text-decoration: none;
  margin: 0 4px;
}

.footer a:hover { text-decoration: underline; }

@media(max-width:480px) {
  body { padding: 12px; padding-top: 25px; }
  .container { border-radius: 14px; }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>
      রফিকে হায়াত
      <i class="fas fa-heart" style="color:#1e7e5e"></i>
    </h1>
    <p>শুধুমাত্র অনুমোদিত অ্যাডমিন ও সুপার অ্যাডমিন</p>
  </div>

  <div class="card">

    <div id="signedOut">

      <div class="form-group">
        <label id="identifierLabel" for="identifier">
          <i class="fas fa-user-shield"></i>
          মোবাইল নম্বর, ইমেইল অথবা ইউজারনেম
        </label>

        <input
          type="text"
          id="identifier"
          placeholder="মোবাইল / ইমেইল / Nurul_Anwar"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">
          <i class="fas fa-lock"></i>
          পাসওয়ার্ড
        </label>

        <div class="password-wrap">
          <input
            type="password"
            id="password"
            placeholder="আপনার পাসওয়ার্ড লিখুন"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="toggle-password"
            id="togglePassword"
            aria-label="পাসওয়ার্ড দেখান"
          >
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <button class="btn btn-block" id="loginBtn" type="button">
        <i class="fas fa-sign-in-alt"></i>
        লগইন করুন
      </button>

      <div style="text-align:right;margin-top:10px">
        <a href="forgot-password.html" style="color:var(--green);font-size:.9rem;text-decoration:none">
          <i class="fas fa-key"></i> পাসওয়ার্ড ভুলে গেছেন?
        </a>
      </div>

      <div id="msg" class="alert hidden" role="alert"></div>

      <div class="note">
        <i class="fas fa-info-circle"></i>
        মোবাইল নম্বর, ইমেইল অথবা ইউজারনেম এবং পাসওয়ার্ড দিয়ে লগইন করুন। OTP বা Twilio প্রয়োজন নেই।
      </div>

    </div>

    <div id="signedIn" class="hidden">

      <div class="alert alert-success" style="text-align:center">
        <i class="fas fa-check-circle"></i>
        লগইন সফল হয়েছে!
        <div style="margin-top:8px">
          <strong id="userIdentity"></strong>
        </div>
      </div>

      <a href="dashboard.html" id="dashboardLink" class="btn btn-block">
        <i class="fas fa-tachometer-alt"></i>
        ড্যাশবোর্ডে যান
      </a>

      <button
        class="btn btn-secondary btn-block"
        id="logoutBtn"
        type="button"
        style="margin-top:12px"
      >
        <i class="fas fa-sign-out-alt"></i>
        লগআউট
      </button>

    </div>

  </div>

  <div class="footer">
    <a href="index.html">
      <i class="fas fa-home"></i>
      মূল পেজ
    </a>
    |
    <a href="login.html">
      <i class="fas fa-shield-alt"></i>
      সদস্য লগইন
    </a>
  </div>

</div>

<script>
"use strict";

if (typeof sb === "undefined") {
  document.body.innerHTML =
    '<div style="padding:30px;color:#b42318;font-family:sans-serif">' +
    'config.js থেকে Supabase Client পাওয়া যায়নি।' +
    '</div>';
  throw new Error("Supabase client (sb) not found.");
}

const identifier = document.getElementById("identifier");
const password = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const msg = document.getElementById("msg");
const togglePassword = document.getElementById("togglePassword");

function showMessage(message, type = "error") {
  msg.className = "alert " +
    (type === "success" ? "alert-success" : "alert-error");
  msg.textContent = message;
  msg.classList.remove("hidden");
}

function hideMessage() {
  msg.classList.add("hidden");
  msg.textContent = "";
}

togglePassword.addEventListener("click", () => {
  const show = password.type === "password";
  password.type = show ? "text" : "password";
  togglePassword.innerHTML = show
    ? '<i class="fas fa-eye-slash"></i>'
    : '<i class="fas fa-eye"></i>';
  togglePassword.setAttribute(
    "aria-label",
    show ? "পাসওয়ার্ড লুকান" : "পাসওয়ার্ড দেখান"
  );
});

// Edge Function দিয়ে বর্তমান লগইন সেশন ও অ্যাডমিন পরিচয় যাচাই
async function verifyAdminSession() {
  const { data: sessionData, error: sessionError } =
    await sb.auth.getSession();

  if (sessionError) throw sessionError;
  if (!sessionData.session) return false;

  const { data, error } = await sb.functions.invoke("admin-login", {
    body: { action: "verify" }
  });

  if (error) throw error;

  return data?.allowed === true;
}

// মোবাইল / ইমেইল / ইউজারনেম দিয়ে লগইন
loginBtn.addEventListener("click", async () => {
  const rawIdentifier = identifier.value.trim();
  const userPassword = password.value;

  hideMessage();

  if (!rawIdentifier || !userPassword) {
    showMessage("মোবাইল নম্বর, ইমেইল অথবা ইউজারনেম এবং পাসওয়ার্ড লিখুন।");
    return;
  }

  loginBtn.disabled = true;
  loginBtn.innerHTML =
    '<i class="fas fa-spinner fa-spin"></i> যাচাই করা হচ্ছে...';

  try {
    const { data, error } = await sb.functions.invoke("admin-login", {
      body: {
        action: "login",
        identifier: rawIdentifier,
        password: userPassword
      }
    });

    if (error) {
      let message = error.message || "Edge Function চালানো যায়নি।";
      if (error.context && typeof error.context.json === "function") {
        try {
          const details = await error.context.json();
          if (details?.message) message = details.message;
        } catch (_) {}
      }
      throw new Error(message);
    }

    if (!data?.success || !data.session) {
      throw new Error(data?.message || "লগইন ব্যর্থ হয়েছে।");
    }

    const { error: setSessionError } = await sb.auth.setSession({
      access_token: data.session.access_token,
      refresh_token: data.session.refresh_token
    });

    if (setSessionError) throw setSessionError;

    showMessage("অ্যাডমিন লগইন সফল হয়েছে।", "success");
    location.replace("dashboard.html");

  } catch (error) {
    console.error("Admin login error:", error);
    showMessage(error.message || "লগইন ব্যর্থ হয়েছে।");
  } finally {
    loginBtn.disabled = false;
    loginBtn.innerHTML =
      '<i class="fas fa-sign-in-alt"></i> লগইন করুন';
  }
});

// Enter চাপলেও লগইন হবে
[identifier, password].forEach((field) => {
  field.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      loginBtn.click();
    }
  });
});

// আগে থেকে লগইন করা থাকলে অ্যাডমিন সেশন যাচাই
async function refreshSession() {
  try {
    const { data, error } = await sb.auth.getSession();
    if (error) throw error;

    if (!data.session) {
      document.getElementById("signedOut").classList.remove("hidden");
      document.getElementById("signedIn").classList.add("hidden");
      return;
    }

    const allowed = await verifyAdminSession();

    if (!allowed) {
      await sb.auth.signOut();

      document.getElementById("signedOut").classList.remove("hidden");
      document.getElementById("signedIn").classList.add("hidden");

      showMessage("এই অ্যাকাউন্টটি অ্যাডমিন হিসেবে অনুমোদিত নয়।");
      return;
    }

    document.getElementById("signedOut").classList.add("hidden");
    document.getElementById("signedIn").classList.remove("hidden");

    document.getElementById("userIdentity").textContent =
      data.session.user.email || "অনুমোদিত অ্যাডমিন";

  } catch (error) {
    console.error("Session verification error:", error);

    document.getElementById("signedOut").classList.remove("hidden");
    document.getElementById("signedIn").classList.add("hidden");

    if (error.message) showMessage(error.message);
  }
}

// লগআউট
logoutBtn.addEventListener("click", async () => {
  logoutBtn.disabled = true;

  try {
    const { error } = await sb.auth.signOut();
    if (error) throw error;

    location.replace("admin-login.html");

  } catch (error) {
    showMessage("লগআউট ব্যর্থ: " + error.message);
    logoutBtn.disabled = false;
  }
});

sb.auth.onAuthStateChange(() => {
  setTimeout(refreshSession, 0);
});

refreshSession();
</script>

</body>
</html>
