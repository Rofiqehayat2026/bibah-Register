<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>লগইন | রফিকে হায়াত</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans Bengali','Segoe UI',Tahoma,sans-serif}
body{background:#f2f5f9;color:#1e2b3a;line-height:1.6;padding:1rem;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{max-width:520px;width:100%;margin:0 auto;background:#fff;border-radius:20px;box-shadow:0 12px 32px rgba(0,20,30,.08);padding:2rem;border:1px solid #e6edf4}
.card{background:#f9fcff;border-radius:16px;padding:1.6rem;margin-bottom:1rem;border:1px solid #d9e6f2}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-weight:600;margin-bottom:.35rem;font-size:.93rem;color:#0b3b4a}
input{width:100%;padding:.7rem 1rem;border:1.5px solid #cbdae5;border-radius:12px;font-size:1rem;background:#fff;outline:none;font-family:inherit;transition:.15s}
input:focus{border-color:#1e7e5e;box-shadow:0 0 0 3px rgba(30,126,94,.15)}
.btn{background:linear-gradient(145deg,#1e7e5e,#146b4e);color:#fff;border:none;padding:.85rem 1.8rem;font-size:1rem;font-weight:700;border-radius:40px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
.btn:hover{background:linear-gradient(145deg,#146b4e,#0e523b);transform:translateY(-1px);box-shadow:0 6px 16px rgba(30,126,94,.25)}
.btn:disabled{opacity:.6;cursor:wait;transform:none;box-shadow:none}
.btn-secondary{background:#e2f0f5;color:#0e4d64;border:1.5px solid #b7d4de}
.btn-secondary:hover{background:#cfe5ee;color:#0e4d64;box-shadow:none}
.btn-block{width:100%}
.alert{padding:.8rem 1.1rem;border-radius:12px;margin:.8rem 0;font-size:.93rem}
.alert-info{background:#e7f1f7;color:#0e4d64}
.alert-error{background:#fce4e4;color:#b42318}
.alert-success{background:#d9f1e8;color:#0f5132}
.note{font-size:.85rem;color:#45748a;background:#e7f1f7;padding:.6rem 1rem;border-radius:10px}
.hidden{display:none!important}
.text-center{text-align:center}
.mt-1{margin-top:.5rem}.mt-2{margin-top:1rem}
.mb-1{margin-bottom:.5rem}.mb-2{margin-bottom:1rem}
.header-title{color:#0e4d64;font-size:2rem;font-weight:700}
.header-title i{color:#1e7e5e}
.slogan{color:#45748a;margin-top:.3rem;font-size:.95rem}
.footer-links{text-align:center;margin-top:1.2rem;font-size:.9rem;color:#45748a}
.footer-links a{color:#1e7e5e;text-decoration:none;margin:0 .4rem}
.footer-links a:hover{text-decoration:underline}
.tab-switch{display:flex;gap:.5rem;margin-bottom:1rem;background:#e8f3f0;padding:.3rem;border-radius:12px}
.tab-switch button{flex:1;padding:.55rem;border:none;background:none;border-radius:9px;cursor:pointer;font-family:inherit;font-weight:600;color:#45748a;font-size:.92rem;transition:.15s}
.tab-switch button.active{background:#1e7e5e;color:#fff}
</style>
</head>
<body>
<div class="container">
  <div class="text-center mb-2">
    <h1 class="header-title">রফিকে হায়াত <i class="fas fa-heart"></i></h1>
    <p class="slogan">সদস্য লগইন</p>
  </div>

  <div class="card">
    <div id="signedOut">
      <!-- ট্যাব সুইচ -->
      <div class="tab-switch">
        <button type="button" id="tabPassword" class="active" onclick="switchTab('password')">
          <i class="fas fa-key"></i> পাসওয়ার্ড
        </button>
        <button type="button" id="tabEmail" onclick="switchTab('email')">
          <i class="fas fa-envelope"></i> ইমেইল লিংক
        </button>
      </div>

      <!-- মোবাইল + পাসওয়ার্ড -->
      <div id="formPassword">
        <div class="form-group">
          <label><i class="fas fa-phone"></i> মোবাইল নম্বর</label>
          <input type="tel" id="loginPhone" placeholder="01XXXXXXXXX" maxlength="11" autocomplete="tel">
        </div>
        <div class="form-group">
          <label><i class="fas fa-lock"></i> পাসওয়ার্ড</label>
          <input type="password" id="loginPassword" placeholder="আপনার পাসওয়ার্ড" autocomplete="current-password">
        </div>
        <button class="btn btn-block" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i> লগইন করুন
        </button>
        <p class="alert mt-2" id="msgPassword" style="display:none"></p>
      </div>

      <!-- ইমেইল ম্যাজিক লিংক (বিকল্প) -->
      <div id="formEmail" class="hidden">
        <div class="form-group">
          <label><i class="fas fa-envelope"></i> ইমেইল ঠিকানা</label>
          <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
        </div>
        <button class="btn btn-block" id="sendEmailBtn">
          <i class="fas fa-paper-plane"></i> লগইন লিংক পাঠান
        </button>
        <p class="alert mt-2" id="msgEmail" style="display:none"></p>
      </div>

      <div class="note mt-2">
        <i class="fas fa-info-circle"></i> প্রথমবার ব্যবহার করছেন? নিচে "রেজিস্ট্রেশন করুন" এ ক্লিক করুন।
      </div>
    </div>

    <div id="signedIn" class="hidden text-center">
      <div class="alert alert-success">
        <i class="fas fa-check-circle"></i> আপনি লগইন করেছেন<br>
        <strong id="userEmailDisplay"></strong>
      </div>
      <a href="dashboard.html" class="btn mt-1" style="display:inline-flex">
        <i class="fas fa-tachometer-alt"></i> ড্যাশবোর্ডে যান
      </a>
      <button class="btn btn-secondary mt-1" onclick="RH.logout()">
        <i class="fas fa-sign-out-alt"></i> লগআউট
      </button>
    </div>
  </div>

  <div class="footer-links">
    <a href="register.html"><i class="fas fa-user-plus"></i> নতুন সদস্য? রেজিস্ট্রেশন করুন</a>
  </div>
</div>

<script>
const msgPassword = document.getElementById('msgPassword');
const msgEmail = document.getElementById('msgEmail');

function showMsg(el, text, isError) {
  el.style.display = 'block';
  el.className = 'alert mt-2 ' + (isError ? 'alert-error' : 'alert-success');
  el.innerHTML = text;
}

function switchTab(which) {
  document.getElementById('tabPassword').classList.toggle('active', which === 'password');
  document.getElementById('tabEmail').classList.toggle('active', which === 'email');
  document.getElementById('formPassword').classList.toggle('hidden', which !== 'password');
  document.getElementById('formEmail').classList.toggle('hidden', which !== 'email');
}

async function refresh() {
  const s = await RH.getSession();
  document.getElementById('signedOut').classList.toggle('hidden', !!s);
  document.getElementById('signedIn').classList.toggle('hidden', !s);
  if (s) document.getElementById('userEmailDisplay').textContent = s.user.email;
}

// ============ মোবাইল + পাসওয়ার্ড লগইন ============
document.getElementById('loginBtn').addEventListener('click', async () => {
  const phone = document.getElementById('loginPhone').value.trim();
  const password = document.getElementById('loginPassword').value;

  if (!/^01\d{9}$/.test(phone)) {
    showMsg(msgPassword, 'সঠিক ১১-ডিজিটের মোবাইল নম্বর লিখুন (01 দিয়ে শুরু)', true);
    return;
  }
  if (!password || password.length < 6) {
    showMsg(msgPassword, 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষর দিন', true);
    return;
  }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> লগইন হচ্ছে...';

  try {
    // ১. মোবাইল থেকে ইমেইল বের করি
    const { data: email, error: rpcErr } = await sb.rpc('find_email_by_phone', { p_phone: phone });

    if (rpcErr) throw new Error('সার্ভার ত্রুটি: ' + rpcErr.message);
    if (!email) throw new Error('এই মোবাইল নম্বর দিয়ে কোনো অ্যাকাউন্ট পাওয়া যায়নি। আগে রেজিস্ট্রেশন করুন।');

    // ২. ইমেইল + পাসওয়ার্ড দিয়ে sign in
    const { error: signInErr } = await sb.auth.signInWithPassword({ email, password });
    if (signInErr) {
      if (signInErr.message.includes('Invalid login credentials')) {
        throw new Error('পাসওয়ার্ড ভুল হয়েছে।');
      }
      throw signInErr;
    }

    // ৩. সফল → ড্যাশবোর্ডে
    showMsg(msgPassword, '✅ লগইন সফল! ড্যাশবোর্ডে যাচ্ছেন...', false);
    setTimeout(() => location.href = 'dashboard.html', 500);
  } catch (err) {
    showMsg(msgPassword, '❌ ' + err.message, true);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> লগইন করুন';
  }
});

// ============ ইমেইল ম্যাজিক লিংক ============
document.getElementById('sendEmailBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showMsg(msgEmail, 'সঠিক ইমেইল ঠিকানা লিখুন', true);
    return;
  }

  const btn = document.getElementById('sendEmailBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> পাঠানো হচ্ছে...';

  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: location.origin + '/dashboard.html' }
  });

  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-paper-plane"></i> লগইন লিংক পাঠান';

  if (error) {
    showMsg(msgEmail, '❌ ' + error.message, true);
  } else {
    showMsg(msgEmail, '✅ আপনার ইমেইলে লগইন লিংক পাঠানো হয়েছে। ইনবক্স/স্প্যাম চেক করুন।', false);
    document.getElementById('loginEmail').value = '';
  }
});

sb.auth.onAuthStateChange(() => refresh());
refresh();
</script>
</body>
</html>
