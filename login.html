
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>লগইন | রফিকে হায়াত</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
:root{
  --primary:#0e4d64;
  --green:#1e7e5e;
  --ink:#1e2b3a;
  --muted:#587487;
  --line:#dce7ef;
  --shadow:0 14px 36px rgba(12,45,62,.09);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  padding:22px;
  background:#f2f5f9;
  color:var(--ink);
  font-family:'Noto Sans Bengali','Segoe UI',sans-serif;
  line-height:1.65;
  display:flex;
  align-items:flex-start;
  justify-content:center;
}
.container{
  width:min(100%,520px);
  margin:clamp(20px,7vh,65px) auto 20px;
  background:#fff;
  border:1px solid #e3ebf1;
  border-radius:20px;
  padding:clamp(18px,4vw,30px);
  box-shadow:var(--shadow);
}
.text-center{text-align:center}
.mt-1{margin-top:.5rem}
.mt-2{margin-top:1rem}
.hidden{display:none!important}
h1{
  color:var(--primary);
  font-size:1.9rem;
  line-height:1.35;
  margin:0;
}
.subtitle{color:#45748a;margin:.35rem 0 1.2rem}
.card{
  border:1px solid var(--line);
  border-radius:15px;
  padding:clamp(16px,3vw,24px);
  box-shadow:0 5px 18px rgba(15,55,75,.045);
}
.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:18px;
}
.tab{
  border:0;
  border-radius:10px;
  padding:11px 8px;
  background:#edf3f6;
  color:var(--primary);
  font:600 .95rem inherit;
  cursor:pointer;
}
.tab.active{background:var(--green);color:#fff}
.form-group{margin-bottom:1rem}
label{
  display:block;
  font-weight:600;
  color:#244b5d;
  margin-bottom:.4rem;
}
input{
  display:block;
  width:100%;
  min-height:46px;
  border:1px solid #cbd9e3;
  border-radius:10px;
  padding:10px 12px;
  background:#fff;
  color:var(--ink);
  font:inherit;
  outline:none;
}
input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(30,126,94,.12);
}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:0;
  border-radius:10px;
  background:var(--green);
  color:#fff;
  padding:12px 17px;
  font:700 1rem inherit;
  cursor:pointer;
  text-decoration:none;
}
.btn:hover{background:#17694e}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-block{width:100%}
.alert{
  padding:12px 14px;
  border-radius:10px;
  margin:12px 0;
  border:1px solid #d5e5ec;
  background:#eef5f8;
  color:#244b5d;
}
.alert-error{
  background:#fff0ef;
  border-color:#f3cbc7;
  color:#9b241b;
}
.alert-success{
  background:#eaf7ef;
  border-color:#c8e8d2;
  color:#17603a;
}
.note{
  background:#f4f8fa;
  border-left:3px solid #8bb7c8;
  padding:10px 12px;
  border-radius:7px;
  color:var(--muted);
  font-size:.85rem;
}
.links{
  font-size:.9rem;
  color:#45748a;
  line-height:2.2;
}
.links a{
  color:var(--green);
  text-decoration:none;
}
.links a:hover{text-decoration:underline}
@media(max-width:420px){
  body{padding:10px}
  .container{border-radius:14px}
  .tab{font-size:.85rem}
}
</style>
</head>

<body>

<div class="container">

  <div class="text-center">
    <h1>
      রফিকে হায়াত
      <i class="fas fa-heart" style="color:#1e7e5e"></i>
    </h1>
    <p class="subtitle">নিরাপদ সদস্য ও অ্যাডমিন লগইন</p>
  </div>

  <div class="card">

    <div class="tabs">
      <button type="button" class="tab active" id="memberTab">
        <i class="fas fa-user"></i> সদস্য লগইন
      </button>

      <button type="button" class="tab" id="adminTab">
        <i class="fas fa-shield-alt"></i> অ্যাডমিন লগইন
      </button>
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label id="identifierLabel" for="identifier">
          <i class="fas fa-mobile-alt"></i> মোবাইল নম্বর
        </label>

        <input
          id="identifier"
          autocomplete="username"
          inputmode="tel"
          placeholder="01XXXXXXXXX"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">
          <i class="fas fa-lock"></i> পাসওয়ার্ড
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="আপনার পাসওয়ার্ড"
          required
        >
      </div>

      <button class="btn btn-block" id="loginBtn" type="submit">
        <i class="fas fa-sign-in-alt"></i> লগইন করুন
      </button>

      <div id="msg" class="alert hidden" role="status" aria-live="polite"></div>

    </form>

    <div class="note mt-2" id="loginNote">
      নিবন্ধনের সময় ব্যবহৃত মোবাইল নম্বর ও পাসওয়ার্ড দিন।
    </div>

  </div>

  <div class="text-center links mt-2">
    <a href="index.html">
      <i class="fas fa-home"></i> মূল পেজ
    </a>
    &nbsp;|&nbsp;
    <a href="register.html">
      <i class="fas fa-user-plus"></i> নতুন সদস্য? রেজিস্ট্রেশন
    </a>
  </div>

</div>

<script>
const form = document.getElementById('loginForm');
const identifier = document.getElementById('identifier');
const password = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const msg = document.getElementById('msg');

const memberTab = document.getElementById('memberTab');
const adminTab = document.getElementById('adminTab');
const label = document.getElementById('identifierLabel');
const note = document.getElementById('loginNote');

let loginKind = 'member';

function setKind(kind){

  loginKind = kind;

  const isMember = kind === 'member';

  memberTab.classList.toggle('active',isMember);
  adminTab.classList.toggle('active',!isMember);

  label.innerHTML = isMember
    ? '<i class="fas fa-mobile-alt"></i> মোবাইল নম্বর'
    : '<i class="fas fa-user-shield"></i> অ্যাডমিন ইউজারনেম';

  identifier.type = 'text';
  identifier.inputMode = isMember ? 'tel' : 'text';
  identifier.autocomplete = 'username';

  identifier.placeholder = isMember
    ? '01XXXXXXXXX'
    : 'Nurul_Anwar';

  note.textContent = isMember
    ? 'নিবন্ধনের সময় ব্যবহৃত মোবাইল নম্বর ও পাসওয়ার্ড দিন।'
    : 'অনুমোদিত অ্যাডমিন ইউজারনেম ও পাসওয়ার্ড দিন।';

  hideMessage();
}

function showMessage(text,isError){

  msg.textContent = text;

  msg.className = 'alert ' +
    (isError ? 'alert-error' : 'alert-success');

}

function hideMessage(){

  msg.textContent = '';
  msg.className = 'alert hidden';

}

memberTab.addEventListener('click',()=>{
  setKind('member');
});

adminTab.addEventListener('click',()=>{
  setKind('admin');
});

form.addEventListener('submit',async(event)=>{

  event.preventDefault();

  hideMessage();

  const value = identifier.value.trim();
  const pass = password.value;

  if(!value || !pass){
    return showMessage(
      'মোবাইল/ইউজারনেম ও পাসওয়ার্ড দিন।',
      true
    );
  }

  if(loginKind === 'member'){

    const normalized = value.replace(/[\s-]/g,'');

    if(!/^(?:\+?88)?01[3-9]\d{8}$/.test(normalized)){
      return showMessage(
        'সঠিক বাংলাদেশি মোবাইল নম্বর দিন (01XXXXXXXXX)।',
        true
      );
    }

  }

  loginBtn.disabled = true;

  loginBtn.innerHTML =
    '<i class="fas fa-spinner fa-spin"></i> যাচাই হচ্ছে...';

  try{

    const {data,error} = await sb.functions.invoke(
      'login-with-identifier',
      {
        body:{
          kind:loginKind,
          identifier:value,
          password:pass
        }
      }
    );

    if(error) throw error;

    if(
      !data?.session?.access_token ||
      !data?.session?.refresh_token
    ){
      throw new Error('বৈধ লগইন সেশন পাওয়া যায়নি।');
    }

    const {error:sessionError} = await sb.auth.setSession({

      access_token:data.session.access_token,
      refresh_token:data.session.refresh_token

    });

    if(sessionError) throw sessionError;

    password.value = '';

    showMessage(
      'লগইন সফল। ড্যাশবোর্ডে নেওয়া হচ্ছে...',
      false
    );

    const destination = loginKind === 'admin'
      ? 'admin-dashboard.html'
      : 'dashboard.html';

    setTimeout(()=>{
      location.replace(destination);
    },700);

  }catch(err){

    console.error('Login error:',err);

    showMessage(
      'লগইন ব্যর্থ। তথ্য সঠিক কি না এবং অ্যাকাউন্ট সক্রিয় কি না যাচাই করুন।',
      true
    );

  }finally{

    loginBtn.disabled = false;

    loginBtn.innerHTML =
      '<i class="fas fa-sign-in-alt"></i> লগইন করুন';

  }

});

</script>

</body>
</html>
