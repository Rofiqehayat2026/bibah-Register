<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রেজিস্ট্রেশন | রফিকে হায়াত</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<div class="container" style="max-width:520px;margin-top:3rem">
  <div class="text-center mb-2">
    <h1 style="color:#0e4d64;font-size:1.8rem">রেজিস্ট্রেশন</h1>
    <p style="color:#45748a">একটি পাসওয়ার্ড দিন অথবা ইমেইল OTP ব্যবহার করুন</p>
  </div>
  <div class="card">
    <div class="form-group"><label>পূর্ণ নাম</label><input id="fullName" placeholder="আপনার নাম"></div>
    <div class="form-group"><label>মোবাইল</label><input id="phone" placeholder="01XXXXXXXXX"></div>
    <div class="form-group"><label>ইমেইল</label><input type="email" id="email" placeholder="your@email.com"></div>
    <div class="form-group"><label>পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label><input type="password" id="password"></div>
    <button class="btn btn-block" id="regBtn"><i class="fas fa-user-plus"></i> রেজিস্ট্রেশন</button>
    <p class="alert mt-2" id="msg" style="display:none"></p>
  </div>
  <div class="text-center" style="font-size:.9rem"><a href="login.html" style="color:#1e7e5e">← লগইন</a></div>
</div>
<script>
document.getElementById('regBtn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const fullName = document.getElementById('fullName').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const msg = document.getElementById('msg');
  if (!email || password.length < 6) { RH.toast('ইমেইল ও ৬+ অক্ষরের পাসওয়ার্ড দিন', false); return; }

  const btn = document.getElementById('regBtn');
  btn.disabled = true; btn.textContent = 'অপেক্ষা করুন...';
  const { data, error } = await sb.auth.signUp({ email, password });
  btn.disabled = false; btn.innerHTML = '<i class="fas fa-user-plus"></i> রেজিস্ট্রেশন';
  msg.style.display = 'block';
  msg.className = error ? 'alert alert-error' : 'alert alert-success';
  if (error) { msg.textContent = error.message; return; }

  if (data.user) {
    await sb.from('profiles').update({ full_name: fullName, phone }).eq('id', data.user.id);
  }
  msg.textContent = 'রেজিস্ট্রেশন সফল! এখন লগইন করুন।';
  setTimeout(() => location.href = 'login.html', 1500);
});
</script>
</body>
</html>
