<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রেজিস্ট্রেশন | রফিকে হায়াত</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>

/* ===== রফিকে হায়াত: এমবেডেড কমন CSS (এই HTML ফাইলের ভেতরেই) ===== */
:root{--primary:#0e4d64;--green:#1e7e5e;--ink:#1e2b3a;--muted:#587487;--line:#dce7ef;--soft:#f2f7fa;--danger:#b42318;--shadow:0 14px 36px rgba(12,45,62,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;padding:20px;background:#f2f5f9;color:var(--ink);font-family:'Noto Sans Bengali','Segoe UI',Tahoma,sans-serif;line-height:1.65}a{color:var(--green);text-decoration:none}a:hover{text-decoration:underline}button,input,select,textarea{font:inherit}button{cursor:pointer} .container{width:min(100%,1100px);margin:0 auto;background:#fff;border:1px solid #e3ebf1;border-radius:20px;padding:clamp(16px,3vw,30px);box-shadow:var(--shadow)}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:clamp(14px,2.5vw,22px);margin:0 0 18px;box-shadow:0 5px 18px rgba(15,55,75,.045)}.text-center{text-align:center}.hidden{display:none!important}.mb-2{margin-bottom:1rem}.mt-1{margin-top:.5rem}.mt-2{margin-top:1rem}.section-title{font-size:1.15rem;font-weight:700;color:var(--primary);margin:1.2rem 0 .7rem}
.form-group{margin-bottom:1rem}.form-group label,label{display:block;font-weight:600;color:#244b5d;margin-bottom:.4rem}input:not([type=checkbox]):not([type=radio]),select,textarea{display:block;width:100%;min-height:44px;border:1px solid #cbd9e3;border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);outline:none;transition:border-color .18s,box-shadow .18s}textarea{min-height:110px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(30,126,94,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;background:var(--green);color:#fff;padding:11px 17px;font-weight:700;transition:transform .15s,background .15s,box-shadow .15s;text-decoration:none}.btn:hover{background:#17694e;transform:translateY(-1px);box-shadow:0 5px 14px rgba(30,126,94,.18);text-decoration:none}.btn:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}.btn-secondary{background:#eaf1f5;color:var(--primary)}.btn-secondary:hover{background:#dce9ef}.btn-block{width:100%}
.alert{padding:12px 14px;border-radius:10px;margin:12px 0;background:#eef5f8;color:#244b5d;border:1px solid #d5e5ec}.alert-info{background:#eef7fb;border-color:#c9e3ef;color:#24566b}.alert-success{background:#eaf7ef;border-color:#c8e8d2;color:#17603a}.alert-error{background:#fff0ef;border-color:#f3cbc7;color:#9b241b}.note{background:#f4f8fa;border-left:3px solid #8bb7c8;padding:10px 12px;border-radius:7px;color:var(--muted)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.badge{display:inline-block;border-radius:30px;padding:5px 11px;font-size:.82rem;font-weight:700;background:#edf2f5;color:#405969}.badge-pending{background:#fff4d6;color:#805b00}.badge-verified{background:#e2f5e9;color:#17603a}.badge-rejected{background:#ffebea;color:#9b241b}.badge-matched{background:#e5f5ed;color:#17603a}
.header-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line)}.header-bar h1{margin:0;color:var(--primary);font-size:clamp(1.25rem,3vw,1.8rem)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:1.2rem;border-bottom:2px solid #d0e0ea;padding-bottom:.45rem}.tab-btn{background:#f1f6f8;border:0;padding:.65rem 1rem;border-radius:10px;cursor:pointer;font-weight:600;color:#45748a;font-family:inherit;font-size:.94rem;transition:.15s}.tab-btn:hover{background:#e8f3f0;color:var(--primary)}.tab-btn.active{background:var(--green);color:#fff}.tab-panel{display:none}.tab-panel.active{display:block}
.modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(7,27,38,.58);padding:18px;overflow:auto;align-items:center;justify-content:center}.modal.show,.modal[style*="display: block"]{display:flex!important}.modal-box{width:min(100%,760px);max-height:92vh;overflow:auto;background:#fff;border-radius:17px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.text-muted{color:var(--muted)}
@media(max-width:760px){body{padding:10px}.container{border-radius:14px}.grid-3{grid-template-columns:1fr}.grid-2{grid-template-columns:1fr}.header-bar{align-items:flex-start}.modal-box{padding:16px}}
@media(max-width:420px){.btn{padding:10px 12px;font-size:.9rem}.tab-btn{padding:.55rem .7rem;font-size:.85rem}}

/* ===== এই পৃষ্ঠার নিজস্ব বিন্যাস ===== */
body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding-top:clamp(20px,7vh,65px)}
.container{max-width:520px!important;width:100%}.container h1{line-height:1.35}.container>.text-center{margin-bottom:20px}.container>.text-center:last-child{line-height:2.1}.container>.card{padding:clamp(18px,4vw,26px)}

</style>
</head>
<body>
<div class="container" style="max-width:520px;margin-top:3rem">
  <div class="text-center mb-2">
    <h1 style="color:#0e4d64;font-size:1.8rem">রেজিস্ট্রেশন</h1>
    <p style="color:#45748a">মোবাইল নম্বর ও পাসওয়ার্ড দিয়ে পরে লগইন করতে পারবেন</p>
  </div>
  <div class="card">
    <div class="form-group">
      <label>পূর্ণ নাম <span style="color:#d14545">*</span></label>
      <input id="fullName" placeholder="আপনার নাম" autocomplete="name">
    </div>
    <div class="form-group">
      <label>মোবাইল <span style="color:#d14545">*</span></label>
      <input id="phone" placeholder="01XXXXXXXXX" inputmode="tel" autocomplete="tel">
    </div>
    <div class="form-group">
      <label>ইমেইল <span style="color:#d14545">*</span> <small>(অ্যাকাউন্ট তৈরির জন্য; লগইনে লাগবে না)</small></label>
      <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর) <span style="color:#d14545">*</span></label>
      <input type="password" id="password" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label>পাসওয়ার্ড আবার দিন <span style="color:#d14545">*</span></label>
      <input type="password" id="password2" autocomplete="new-password">
    </div>
    <button class="btn btn-block" id="regBtn">
      <i class="fas fa-user-plus"></i> রেজিস্ট্রেশন
    </button>
    <p class="alert mt-2" id="msg" style="display:none"></p>
  </div>
  <div class="text-center" style="font-size:.9rem">
    <a href="index.html" style="color:#1e7e5e"><i class="fas fa-home"></i> মূল পেজ</a>
    &nbsp;|&nbsp;
    <a href="login.html" style="color:#1e7e5e">← লগইন</a>
  </div>
</div>

<script>
const msg = document.getElementById('msg');
const regBtn = document.getElementById('regBtn');

function normalizeBDPhone(value) {
  const bnDigits = '০১২৩৪৫৬৭৮৯';
  const converted = String(value || '').replace(/[০-৯]/g, d => String(bnDigits.indexOf(d)));
  const digits = converted.replace(/\D/g, '');
  if (/^01[3-9]\d{8}$/.test(digits)) return digits;
  if (/^8801[3-9]\d{8}$/.test(digits)) return digits.slice(2);
  if (/^008801[3-9]\d{8}$/.test(digits)) return digits.slice(4);
  return '';
}

function showMsg(text, isError = false) {
  msg.style.display = 'block';
  msg.className = 'alert mt-2 ' + (isError ? 'alert-error' : 'alert-success');
  msg.textContent = text;
}

regBtn.addEventListener('click', async () => {
  const fullName = document.getElementById('fullName').value.trim();
  const phone = normalizeBDPhone(document.getElementById('phone').value);
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;

  // ভ্যালিডেশন
  if (!fullName) return showMsg('পূর্ণ নাম লিখুন', true);
  if (!phone) {
    return showMsg('সঠিক বাংলাদেশি মোবাইল নম্বর দিন (01XXXXXXXXX)', true);
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    return showMsg('সঠিক ইমেইল ঠিকানা দিন', true);
  }
  if (password.length < 6) return showMsg('পাসওয়ার্ড কমপক্ষে ৬ অক্ষর হতে হবে', true);
  if (password !== password2) return showMsg('পাসওয়ার্ড দুইবার একই দিন', true);

  regBtn.disabled = true;
  regBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> অপেক্ষা করুন...';
  msg.style.display = 'none';

  try {
    const { data, error } = await sb.auth.signUp({
      email,
      password,
      options: {
        // trigger এগুলো profiles-এ বসিয়ে দেবে
        data: { full_name: fullName, phone }
      }
    });

    if (error) {
      showMsg('রেজিস্ট্রেশন ব্যর্থ: ' + error.message, true);
      return;
    }

    // ইমেইল ইতিমধ্যে থাকলে identities খালি
    if (data.user?.identities?.length === 0) {
      showMsg('এই ইমেইলে আগেই অ্যাকাউন্ট আছে। লগইন করুন।', true);
      return;
    }

    // যদি সেশন পাওয়া যায় (Confirm email বন্ধ), সরাসরি প্রোফাইল আপডেটের চেষ্টা
    if (data.session?.user) {
      const { error: pErr } = await sb.from('profiles').upsert({
        id: data.session.user.id,
        full_name: fullName,
        phone
      }, { onConflict: 'id' });
      if (pErr) console.warn('profile upsert:', pErr);

      showMsg('✅ রেজিস্ট্রেশন সফল! ড্যাশবোর্ডে নিয়ে যাচ্ছি...');
      setTimeout(() => location.href = 'dashboard.html', 1200);
    } else {
      // Confirm email চালু: ইমেইল যাচাই দরকার
      showMsg('✅ রেজিস্ট্রেশন সফল! ইমেইলে পাঠানো যাচাই লিংকে ক্লিক করে অ্যাকাউন্ট সক্রিয় করুন।');
      setTimeout(() => location.href = 'login.html', 2200);
    }
  } catch (err) {
    console.error(err);
    showMsg('ব্যর্থ: ' + (err.message || 'নেটওয়ার্ক সমস্যা'), true);
  } finally {
    regBtn.disabled = false;
    regBtn.innerHTML = '<i class="fas fa-user-plus"></i> রেজিস্ট্রেশন';
  }
});
</script>
</body>
</html>
